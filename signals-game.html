nav button.on{background:var(--acc2);color:#2b2b2b}
.stage{border-radius:32px;padding:6px;margin:10px 0}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}

.lv b{display:block;font-size:30px;font-weight:800}
.lv.lock{filter:grayscale(1);opacity:.45}.lv.done::after{content:"✓";position:absolute;top:6px;right:10px;font-size:17px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:6px}

.tabs button.on{background:var(--ink);color:var(--bg)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:8px}
.o{border-radius:16px;background:var(--card);padding:8px 2px;font-size:12px;font-weight:700;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:3px solid transparent}
.o.on{border-color:var(--acc)}.o.l{opacity:.5}.o s{width:24px;height:24px;border-radius:50%;display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.modal{position:fixed;inset:0;background:rgba(10,10,25,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:460px;border-radius:30px 30px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}

.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-weight:700}
select{font:inherit;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}

#app{max-width:1100px}main{padding:22px 30px 90px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:14px}
.lv{cursor:pointer;min-height:120px;transition:transform .12s}.lv:not(.lock):hover{transform:translateY(-4px)}

["Gaming is no longer just playing","Game & Chat","Games like Roblox and Fortnite aren’t only about winning. They’re places where teens spend time together, share experiences and feel part of a community.","You were playing, but you were with them."],

["Fandoms turn interests into communities","Club Crest Match-3","Being a fan means connecting with people who share your passion, through inside jokes, theories and fan art, even without ever meeting.","A shared interest, and we’re a community."],
["Belonging comes from rituals","Ritual Simon","Small repeated actions become rituals: a song every morning, playing at the same time, the same photo. They build shared memories and identity.","We do it this way because we always have."],
["Socialising doesn’t always require energy","Idle Chat","Staying connected doesn’t need big plans. A meme, a quick game or a video together is enough to feel close without pressure.","You don’t need to say much to be there."],
["The group chat is a place","The Room","Group chats are shared digital spaces where everyday life unfolds. Like a meeting place, they bring continuity and belonging even when apart.","The chat is where we meet."],
["Personalisation makes things ours","Customizer","Stickers, charms and patches turn everyday objects into reflections of who you are and which communities you belong to.","It’s not just any object. It’s mine."],
["Friendship happens in the background","Streaks","You can feel close just by sharing a space, like staying on a Discord call while studying. Knowing someone is there is enough.","You don’t need to meet daily to be friends."],
["Small things carry big meanings","Spot the Difference","A friendship bracelet or a handwritten note holds more meaning than it seems. Little details keep memories and affection alive.","A tiny detail can mean a lot."],
["Shared experiences don’t need shared locations","Watch Party","Watching a film online or playing the same game creates togetherness across distance. What matters is who you share it with, not where you are.","Each at home, yet together."],
["Curation is a form of self-expression","Tidy Up","Teens express identity through what they collect and save: boards, playlists, moodboards. Choosing references builds a visual language of who they are.","What you leave out says who you are, too."],
["Analog gestures feel more personal","Phone Off","In a world of instant screens, a letter, a printed photo or a handmade gift shows time and intention. They become keepsakes.","Paper carries your pulse."],
["There are different levels of being social","Most Likely To","Being social is a spectrum, from viewing a story or sending an emoji to a deep talk or meeting in person. Everyone connects at their own pace.","We don’t all speak alike. We all mean the same."],

["Digital culture leaves physical traces","Jigsaw","Online moments, memes and conversations can become physical objects: printed screenshots, meme stickers, photos. They give digital life a lasting presence.","Digital leaves a trace too."]];

function go(s,n){clearTimeout(tm);S.screen=s;S.home=false;S.fin=false;if(n)S.lvl=n;render();
const run=(ms,f)=>{requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=document.querySelector(".ld i");if(b){b.style.transitionDuration=ms+"ms";b.style.width="100%"}}));tm=setTimeout(f,ms)};
if(s==="boot")run(7000,()=>go("map"));if(s==="lvload")run(5000,()=>go("level"))}
const stage=w=>`<div class="stage" style="background:${A.bg}">${av(A)}</div>`;
function title(){return `<div class="full"><h1 style="font-size:clamp(48px,9vw,96px)">SIGNALS</h1><p class="mut">Gaming is no longer just playing</p><div class="st">${av(A)}</div><button class="btn" data-a="start">Play</button><p class="mut" style="font-size:14px">Press Enter</p></div>`}
function boot(){return `<div class="full"><span class="tag">Loading</span><h1>SIGNALS</h1><p>Signals is a collection of 19 mini-games about how teens connect today. Each level is a signal: a small truth about friendship, culture and belonging.</p><div class="ld"><i></i></div></div>`}
function map(){let h=`<div class="head"><h2>Choose a signal</h2><div style="min-width:220px"><b>${S.done} / 19 completed</b><div class="bar"><i style="width:${S.done/19*100}%"></i></div></div></div><div class="map">`;
LV.forEach((l,i)=>{const n=i+1,lock=n>S.done+1;h+=`<button class="lv ${lock?"lock":""} ${n<=S.done?"done":""}" style="background:${PAL[i%6]}" ${lock?"disabled":""} data-a="lvl" data-n="${n}"><b>${lock?"🔒":n}</b>${l[1]}</button>`});return h+`</div>`}
function homeOld(){let h=`<div class="head"><h2>My place</h2><button class="btn alt" data-a="home">← Back to map</button></div><div class="panel"><div>${stage()}<b>${S.done} / 19 signals completed</b><div class="bar"><i style="width:${S.done/19*100}%"></i></div></div><div><div class="tabs"><button class="${S.ptab==="avatar"?"on":""}" data-a="pt" data-k="avatar">Avatar</button><button class="${S.ptab==="opts"?"on":""}" data-a="pt" data-k="opts">Options</button></div>`;
if(S.ptab==="opts")return h+`<div class="sw">Sound and music<button class="btn alt" data-a="snd">${S.snd?"On":"Off"}</button></div><div class="sw">Vibration (mobile)<button class="btn alt" data-a="vib">${S.vib?"On":"Off"}</button></div><div class="sw">Fullscreen<button class="btn alt" data-a="fs">Toggle</button></div><div class="sw">Theme<button class="btn alt" data-a="theme">Switch</button></div><div class="sw">Progress<button class="btn alt" data-a="reset">Reset</button></div></div></div>`;
h+=`<div class="tabs">`;C.forEach(c=>h+=`<button class="${S.cat===c[0]?"on":""}" data-a="cat" data-k="${c[0]}">${c[1]}</button>`);h+=`</div><div class="opts">`;
const c=C.find(x=>x[0]===S.cat);c[2].forEach(o=>{const ok=un(o[2]);h+=`<button class="o ${A[c[0]]===o[0]?"on":""} ${ok?"":"l"}" data-a="set" data-k="${c[0]}" data-v="${o[0]}">${o[3]?`<s style="background:${o[3]}"></s>`:""}${ok?o[1]:"🔒 Lv "+o[2]}</button>`});
return h+`</div><div class="row" style="margin-top:12px"><button class="btn alt" data-a="rnd">🎲 Random</button></div></div></div>`}
function home(){const p=`<b>${S.done} / 19 signals completed</b><div class="bar"><i style="width:${S.done/19*100}%"></i></div>`;
if(S.sub==="avatar")return avSub();if(S.sub==="opts")return optsSub();
return `<div class="head"><h2>Lobby</h2><button class="btn alt" data-a="home">← Back to map</button></div><div class="lobby"><div>${stage()}</div><div><input class="nick" id="nick" value="${S.nick}" maxlength="14" aria-label="Nickname"><p class="mut" style="margin-bottom:14px">Click your name to change it</p>${p}<div class="menu"><button class="btn" data-a="sub" data-k="avatar">🧑 Customize avatar</button><button class="btn alt" data-a="sub" data-k="opts">⚙️ Options</button></div></div></div>`}
function avSub(){let h=`<div class="head"><h2>Customize avatar</h2><button class="btn alt" data-a="sub" data-k="main">← Lobby</button></div><div class="panel"><div>${stage()}</div><div><div class="tabs">`;
C.forEach(c=>h+=`<button class="${S.cat===c[0]?"on":""}" data-a="cat" data-k="${c[0]}">${c[1]}</button>`);h+=`</div><div class="opts">`;
const c=C.find(x=>x[0]===S.cat);c[2].forEach(o=>{const ok=un(o[2]);h+=`<button class="o ${A[c[0]]===o[0]?"on":""} ${ok?"":"l"}" data-a="set" data-k="${c[0]}" data-v="${o[0]}">${o[3]?`<s style="background:${o[3]}"></s>`:""}${ok?o[1]:"🔒 Lv "+o[2]}</button>`});
return h+`</div><div class="row" style="margin-top:12px"><button class="btn alt" data-a="rnd">🎲 Random</button></div></div></div>`}
function optsSub(){return `<div class="head"><h2>Options</h2><button class="btn alt" data-a="sub" data-k="main">← Lobby</button></div><div class="card" style="margin-top:12px"><div class="sw">Sound and music<button class="btn alt" data-a="snd">${S.snd?"On":"Off"}</button></div><div class="sw">Vibration (mobile)<button class="btn alt" data-a="vib">${S.vib?"On":"Off"}</button></div><div class="sw">Fullscreen<button class="btn alt" data-a="fs">Toggle</button></div><div class="sw">Theme<button class="btn alt" data-a="theme">Switch</button></div><div class="sw">Progress<button class="btn alt" data-a="reset">Reset</button></div></div>`}
function lvload(){const l=LV[S.lvl-1];return `<div class="full"><span class="tag">Signal ${pad(S.lvl)} / 19</span><h1 style="font-size:clamp(30px,5vw,56px);max-width:900px">${l[0]}</h1><p>${l[2]}</p><div class="ld"><i></i></div><button class="btn alt" data-a="skip" style="margin-top:14px">Skip</button></div>`}
function level(){const l=LV[S.lvl-1],r=rewards(S.lvl);
const body=S.fin?`<span class="tag">Level complete</span><h2 style="margin-top:10px">“${l[3]}”</h2><p class="mut">Unlocked: ${r.length?r.join(", "):"nothing new"}</p><div class="row" style="margin-top:16px"><button class="btn" data-a="map">Back to map</button>${S.lvl<19?`<button class="btn alt" data-a="lvl" data-n="${S.lvl+1}">Next signal</button>`:""}</div>`
:`<span class="tag">${l[1]}</span><h2 style="margin-top:10px">Mini-game coming soon</h2><p class="mut">This is where “${l[1]}” will be played. For now you can simulate finishing it.</p><div class="row" style="margin-top:16px"><button class="btn" data-a="done">Complete (demo)</button><button class="btn alt" data-a="map">Back</button></div>`;
return `<div class="head"><h2>${pad(S.lvl)} · ${l[0]}</h2></div><div class="card" style="margin-top:12px">${body}</div>`}
function render(){const sc=S.screen,fab=sc==="map"?`<button class="fab" data-a="home" aria-label="${S.home?"Back to map":"My place"}">${S.home?"🗺️":"🏠"}</button>`:"";
document.getElementById("app").innerHTML=`<main>${{title,boot,map:()=>S.home?home():map(),lvload,level}[sc]()}</main>`+fab}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,n=+b.dataset.n;
if(a==="start")return go("boot");if(a==="lvl")return go("lvload",n);if(a==="skip")return go("level");if(a==="map")return go("map");
if(a==="home"){S.home=!S.home;S.sub="main"}else if(a==="sub")S.sub=b.dataset.k;else if(a==="cat")S.cat=b.dataset.k;
else if(a==="set"){const c=C.find(x=>x[0]===b.dataset.k),o=c[2].find(x=>x[0]===b.dataset.v);if(un(o[2]))A[c[0]]=o[0]}
else if(a==="rnd")C.forEach(c=>{const ok=c[2].filter(o=>un(o[2]));A[c[0]]=ok[Math.floor(Math.random()*ok.length)][0]});
else if(a==="done"){S.done=Math.max(S.done,S.lvl);S.fin=true}
else if(a==="snd")S.snd=!S.snd;else if(a==="vib")S.vib=!S.vib;
else if(a==="fs"){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(x){}}
else if(a==="theme"){const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"}
else if(a==="reset"){S.done=0;C.forEach(c=>{const o=c[2].find(x=>x[0]===A[c[0]]);if(o&&!un(o[2]))A[c[0]]=c[2][0][0]})}
render()});
document.addEventListener("input",e=>{if(e.target.id==="nick")S.nick=e.target.value.replace(/[<>"&]/g,"")});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&S.screen==="title")go("boot");if(e.key==="Escape"){if(S.home){if(S.sub!=="main")S.sub="main";else S.home=false;render()}else if(S.screen==="level")go("map")}});
render();
</script></body></html>
